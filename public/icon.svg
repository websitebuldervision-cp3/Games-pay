<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.4" />
  <g transform="translate(256, 256)">
    <!-- Outer Neon Ring -->
    <circle r="170" fill="none" stroke="url(#neonCyan)" stroke-width="12" filter="url(#glow)" />
    <!-- Gamepad Icon Silhouette -->
    <path d="M-90,-50 C-120,-50 -140,-10 -130,50 L-110,100 C-100,120 -80,120 -70,100 L-40,40 L40,40 L70,100 C80,120 100,120 110,100 L130,50 C140,-10 120,-50 90,-50 Z" fill="#0b1329" stroke="#00f0ff" stroke-width="10" />
    <!-- D-Pad -->
    <path d="M-75,-5 L-65,-5 L-65,-15 L-55,-15 L-55,-5 L-45,-5 L-45,5 L-55,5 L-55,15 L-65,15 L-65,5 L-75,5 Z" fill="#00f0ff" />
    <!-- Action Buttons -->
    <circle cx="55" cy="-10" r="7" fill="#ff007a" />
    <circle cx="70" cy="5" r="7" fill="#00f0ff" />
    <circle cx="40" cy="5" r="7" fill="#ffd700" />
    <circle cx="55" cy="20" r="7" fill="#00e676" />
    <!-- Crown for Cp3 -->
    <path d="M-30,-75 L-15,-95 L0,-75 L15,-95 L30,-75 L20,-60 L-20,-60 Z" fill="#ffd700" filter="url(#glow)" />
  </g>
</svg>
